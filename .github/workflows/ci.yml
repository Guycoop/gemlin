name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest ruff
      - run: ruff check --select E4,E7,E9,F .  # the classic default rules
      - run: python -m pytest -q

  installer:  # the one-line installers from gemlin.dev, run for real (installing this commit)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          GEMLIN_SOURCE="file://$PWD" GEMLIN_NO_START=1 sh site/install.sh
          "$HOME/.local/bin/gemlin" --version
          "$HOME/.local/bin/gemlin" skills
          if [ "$RUNNER_OS" = macOS ]; then test -x "$HOME/Applications/Gemlin.app/Contents/MacOS/Gemlin"; else test -f "$HOME/.local/share/applications/gemlin.desktop"; fi
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GEMLIN_SOURCE = "file:///" + ($PWD.Path -replace '\\', '/')
          $env:GEMLIN_NO_START = "1"
          ./site/install.ps1
          $gemlin = Join-Path $env:USERPROFILE ".local\bin\gemlin.exe"
          & $gemlin --version
          & $gemlin skills
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Gemlin.lnk")) { throw "no Start menu shortcut" }
          $uv = (Get-Command uv -ErrorAction SilentlyContinue).Source; if (-not $uv) { $uv = Join-Path $env:USERPROFILE ".local\bin\uv.exe" }
          & (Join-Path (& $uv tool dir).Trim() "gemlin\Scripts\python.exe") -c "import pystray, PIL; print('tray ok')"
      - name: install.ps1 again, on Windows PowerShell 5.1 (the default for irm | iex)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:GEMLIN_SOURCE = "file:///" + ($PWD.Path -replace '\\', '/')
          $env:GEMLIN_NO_START = "1"
          ./site/install.ps1
          & (Join-Path $env:USERPROFILE ".local\bin\gemlin.exe") --version
